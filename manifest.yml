app:
  id: ari:cloud:ecosystem::app/53d4112c-bcbe-4a7e-ade7-a44df94a6995
  runtime:
    name: nodejs24.x
    memoryMB: 512
    architecture: arm64
  # Jira is required; Confluence is optional and only used to publish inspection reports.
  compatibility:
    jira:
      required: true
    confluence:
      required: false

modules:
  jira:projectPage:
    - key: command-center
      title: Foreman Command Center
      resource: command-center
      resolver:
        function: resolver-fn
      layout: blank

  jira:issuePanel:
    - key: evidence-panel
      title: Evidence & Code Review
      icon: resource:ui-assets;icon.svg
      resource: issue-panel
      resolver:
        function: resolver-fn
      viewportSize: large

  jira:customField:
    - key: foreman-trade
      name: Trade
      description: Construction trade responsible for this work (Foreman).
      type: string
    - key: foreman-level
      name: Location / Level
      description: Building level or area, e.g. Level 2 or Foundation (Foreman).
      type: string
    - key: foreman-permit-no
      name: Permit number
      description: Jurisdiction permit number this work falls under (Foreman).
      type: string
    - key: foreman-jurisdiction
      name: Jurisdiction
      description: Authority having jurisdiction for permits and inspections (Foreman).
      type: string
    - key: foreman-risk
      name: Foreman risk score
      description: 0-100 risk score computed by the Foreman monitor. Read-only.
      type: number
      readOnly: true
    - key: foreman-stage
      name: Foreman stage
      description: Permit or inspection stage tracked by Foreman (for example In Review, Scheduled, Passed). Read-only; changes go through Foreman approvals.
      type: string
      readOnly: true

  jira:entityProperty:
    - key: foreman-issue-property
      entityType: issue
      propertyKey: foreman
      values:
        - path: seedId
          type: string
          searchAlias: foremanSeed
        - path: kind
          type: string
          searchAlias: foremanKind
        - path: stage
          type: string
          searchAlias: foremanStage
        - path: scheduledFor
          type: date
          searchAlias: foremanScheduled
        - path: submittedOn
          type: date
          searchAlias: foremanSubmitted
        - path: expiresOn
          type: date
          searchAlias: foremanExpires
        - path: contractor
          type: string
          searchAlias: foremanContractor

  rovo:agent:
    - key: foreman-agent
      name: Foreman
      description: Construction operations agent. Explains what is blocking permits and
        inspections, reviews plan sheets against code rules, drafts inspection reports and
        approval packets, and proposes fixes for a human to approve.
      icon: resource:ui-assets;icon.svg
      prompt: resource:agent-resources;foreman-prompt.txt
      conversationStarters:
        - What's blocking our framing inspection?
        - Review sheet A-201 against egress rules
        - Draft the approval packet for permit P-2
        - What are the biggest risks on this project right now?
      followUpPrompt: Suggest up to three short follow-up questions a construction project manager would ask next, based on the risks, findings or proposals just discussed.
      actions:
        - review-plan-against-code
        - get-project-risks
        - create-inspection-report
        - propose-resolution
        - request-approval
        - approve-pending
      skills:
        - plan-code-review
        - inspection-readiness
        - approval-packet

  graph:connector:
    - key: city-permit-portal
      name: City permit portal (demo)
      icons:
        light: resource:ui-assets;icon.svg
        dark: resource:ui-assets;icon.svg
      objectTypes:
        - atlassian:work-item
      capabilities:
        replicatesPermissions: false
        syncFidelity: upsert
        supportsIncrementalSync: false
      datasource:
        formConfiguration:
          instructions:
            - Connects the Riverside Commons demo permit portal. Plan-check events and inspection results are added to Teamwork Graph and linked to the matching Foreman permits and inspections.
          form:
            - key: portal
              type: header
              title: Demo city permit portal
              description: No credentials are needed for the demo portal.
              properties:
                - key: jurisdiction
                  label: Jurisdiction name
                  type: string
                  isRequired: false
          validateConnection:
            function: twg-validate-fn
        onConnectionChange:
          function: twg-connection-fn

  rovo:skill:
    - key: plan-code-review
      source:
        dir: skills/plan-code-review
      dependencies:
        tools:
          - review-plan-against-code
          - propose-resolution
    - key: inspection-readiness
      source:
        dir: skills/inspection-readiness
      dependencies:
        tools:
          - get-project-risks
          - create-inspection-report
          - propose-resolution
    - key: approval-packet
      source:
        dir: skills/approval-packet
      dependencies:
        tools:
          - request-approval
          - get-project-risks
          - approve-pending

  rovo:mcp:
    - key: foreman-mcp
      name: Foreman Construction
      tools:
        - review-plan-against-code
        - get-project-risks
        - create-inspection-report
        - propose-resolution
        - request-approval
        - approve-pending

  action:
    - key: review-plan-against-code
      name: Review plan against code
      function: action-review-plan-fn
      actionVerb: GET
      description: >-
        Checks a plan sheet (e.g. A-201) against Foreman's code rule pack (IBC 2021, ADA,
        ACI 318) and returns findings with citations and verbatim evidence quotes. Optional
        focus: egress, fire separation, accessibility, structural or permit.
      inputs:
        sheetId:
          title: Plan sheet
          type: string
          required: true
          description: Sheet number, for example A-201, S-101 or FP-101.
        focus:
          title: Rule focus
          type: string
          required: false
          description: One of egress, fire separation, accessibility, structural, permit, or all.
        projectKey:
          title: Jira project key
          type: string
          required: false
          description: Project key such as FMD. Optional when there is only one Foreman project.
    - key: get-project-risks
      name: Get project risks and blockers
      function: get-project-risks-fn
      actionVerb: GET
      description: >-
        Returns the project's risk score and open problems (out-of-sequence inspections,
        stuck or expiring permits, aging RFIs, contradictions) with reasons. With a focus,
        returns what blocks that permit, inspection or RFI.
      inputs:
        focus:
          title: Work item
          type: string
          required: false
          description: Key or name of a work item, e.g. FMD-9, "framing inspection" or "permit P-2".
        projectKey:
          title: Jira project key
          type: string
          required: false
          description: Project key such as FMD. Optional when there is only one Foreman project.
    - key: create-inspection-report
      name: Create inspection report
      function: action-create-report-fn
      actionVerb: CREATE
      description: >-
        Drafts a verified inspection report from field notes, transcripts, photos and plan
        sheets, and creates a proposal to publish it for inspector sign-off. Never passes
        the inspection.
      inputs:
        inspection:
          title: Inspection
          type: string
          required: true
          description: Inspection key or name, e.g. FMD-6 or "rebar inspection".
        projectKey:
          title: Jira project key
          type: string
          required: false
          description: Project key such as FMD.
    - key: propose-resolution
      name: Propose resolution
      function: action-propose-fn
      actionVerb: CREATE
      description: >-
        Creates an approvable proposal to reschedule, notify a contractor, escalate to the
        city, or re-inspect a work item. Nothing changes until a human approves it.
      inputs:
        issue:
          title: Work item
          type: string
          required: true
          description: Key or name of the permit, inspection or RFI.
        kind:
          title: Proposal type
          type: string
          required: true
          description: One of reschedule, notify, escalate, reinspect.
        reason:
          title: Reason
          type: string
          required: true
          description: Short plain-English reason for the proposal.
        newDate:
          title: New date
          type: string
          required: false
          description: For reschedule or reinspect, the new date as YYYY-MM-DD.
        recipient:
          title: Recipient
          type: string
          required: false
          description: For notify or escalate, who should receive it (contractor, city, architect).
        message:
          title: Message
          type: string
          required: false
          description: For notify or escalate, the message to send.
        projectKey:
          title: Jira project key
          type: string
          required: false
          description: Project key such as FMD.
    - key: request-approval
      name: Request approval
      function: action-approval-fn
      actionVerb: CREATE
      description: >-
        Drafts an approval packet for a permit (conditions, inspections, findings, risks,
        readiness) or a sign-off request for an inspection report, as a proposal for human
        approval. Returns the packet text.
      inputs:
        target:
          title: Permit or inspection
          type: string
          required: true
          description: Key or name, e.g. "permit P-2", FMD-2 or "framing inspection".
        note:
          title: Note
          type: string
          required: false
          description: Optional note for the approver.
        projectKey:
          title: Jira project key
          type: string
          required: false
          description: Project key such as FMD.
    - key: approve-pending
      name: Approve pending proposal
      function: action-approve-fn
      actionVerb: UPDATE
      description: >-
        Approves and runs one pending Foreman proposal as the current user. Only use when the
        user explicitly asks to approve a specific proposal number and has confirmed it.
      inputs:
        proposalId:
          title: Proposal number
          type: integer
          required: true
          description: The proposal number, e.g. 12.
        confirmed:
          title: User confirmed
          type: boolean
          required: true
          description: True only if the user explicitly confirmed approving this proposal in this conversation.
        note:
          title: Note
          type: string
          required: false
          description: Optional approval note.

  llm:
    - key: foreman-llm
      model:
        - claude

  sql:
    - key: foreman-db
      engine: mysql

  consumer:
    - key: jobs-consumer
      queue: foreman-jobs
      function: jobs-consumer-fn

  scheduledTrigger:
    - key: monitor-hourly
      function: monitor-hourly-fn
      interval: hour
    - key: digest-daily
      function: digest-daily-fn
      interval: day

  trigger:
    - key: lifecycle-trigger
      function: lifecycle-fn
      events:
        - avi:forge:installed:app
        - avi:forge:upgraded:app
    - key: issue-events-trigger
      function: issue-events-fn
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true

  function:
    - key: resolver-fn
      handler: index.resolver
    - key: jobs-consumer-fn
      handler: index.jobsConsumer
      timeoutSeconds: 900
    - key: monitor-hourly-fn
      handler: index.monitorHourly
      timeoutSeconds: 300
    - key: digest-daily-fn
      handler: index.digestDaily
      timeoutSeconds: 300
    - key: lifecycle-fn
      handler: index.lifecycle
    - key: issue-events-fn
      handler: index.issueEvents
    - key: get-project-risks-fn
      handler: index.getProjectRisks
    - key: action-review-plan-fn
      handler: index.reviewPlanAgainstCode
    - key: action-create-report-fn
      handler: index.createInspectionReport
    - key: action-propose-fn
      handler: index.proposeResolution
    - key: action-approval-fn
      handler: index.requestApproval
    - key: action-approve-fn
      handler: index.approvePending
    - key: twg-connection-fn
      handler: index.onConnectionChange
    - key: twg-validate-fn
      handler: index.validatePortalConnection

resources:
  - key: command-center
    path: static/ui/build/command-center
  - key: issue-panel
    path: static/ui/build/issue-panel
  - key: ui-assets
    path: static/assets
  - key: agent-resources
    path: resources/agent

permissions:
  scopes:
    # Read issues, projects and statuses (monitor, panels, Rovo actions, event triggers).
    - read:jira-work
    # Create demo work items, comments, attachments, links and transitions; set Foreman field values.
    - write:jira-work
    # Demo setup: issue types, issue type scheme, link types, screens, project creation.
    - manage:jira-configuration
    # Demo setup: project properties and scheme assignment on the Foreman demo project.
    - manage:jira-project
    # Current user (project lead for the demo project).
    - read:jira-user
    # Forge hosted storage (KVS for config and demo state).
    - storage:app
    # Confluence (optional): find or create the report space, publish and update report pages.
    - read:space:confluence
    - write:space:confluence
    - read:page:confluence
    - write:page:confluence
    # Teamwork Graph API (read, asUser): work items, comments, people, Confluence pages, spaces.
    - read:graph:issue:jira
    - read:graph:issue-comment:jira
    - read:graph:issue-status:jira
    - read:graph:project:jira
    - read:graph:user:atlassian
    - read:graph:page:confluence
    - read:graph:blogpost:confluence
    - read:graph:work-item:external
    # Teamwork Graph connector (city permit portal records -> graph objects).
    - write:object:jira
    - read:object:jira
    - delete:object:jira
  content:
    # Inline style attributes in Custom UI (progress bars, dynamic widths).
    styles:
      - unsafe-inline
